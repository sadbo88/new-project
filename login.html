<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Account | P&amp;J Restaurant</title>

  <link rel="stylesheet" href="bcs/bootstrap.min.css"> <!-- bootstrap -->
  <link rel="stylesheet" href="css/theme.css"> <!-- black & gold theme (all pages) -->
</head>
<body>

<!-- Mobile top bar + burger -->
<header class="topbar d-lg-none">
  <a href="index.html" class="brand"><img src="files/Logo.jpg" alt=""><span>P&amp;J</span></a>
  <button class="burger" type="button" data-bs-toggle="offcanvas" data-bs-target="#mainNav" aria-controls="mainNav" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
</header>

<!-- Sidebar: fixed on desktop, slide-in menu on mobile -->
<aside id="mainNav" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" aria-label="Main navigation">
  <div class="sidebar-head">
    <a href="index.html" class="brand"><img src="files/Logo.jpg" alt="P&amp;J Restaurant logo"><span>P&amp;J</span> Restaurant</a>
    <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#mainNav" aria-label="Close menu"></button>
  </div>
  <div class="sidebar-body">
    <nav class="navbar-nav">
        <a href="index.html" class="nav-link"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span><span class="nav-text">Home</span></a>
        <a href="menu.html" class="nav-link"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7M3 3v5a3 3 0 0 0 6 0V3M6 10v11"/><path d="M17 21V3c-2.5 1.5-4 4-4 7.5V14h4"/></svg></span><span class="nav-text">Menu</span></a>
        <a href="reservation.html" class="nav-link"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span class="nav-text">Reserve</span></a>
        <a href="cart.html" class="nav-link"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg></span><span class="nav-text">Cart</span> <span id="cartCount" class="badge bg-warning text-dark">0</span></a>
        <a href="contact.html" class="nav-link"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span class="nav-text">Contact</span></a>
        <a href="a.html" class="nav-link"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span><span class="nav-text">About us</span></a>
        <a href="login.html" class="nav-link active" aria-current="page"><span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span><span class="nav-text">Login</span></a>
    </nav>
  </div>
  <div class="sidebar-foot">
    <a href="reservation.html" class="btn btn-warning btn-sm w-100 mb-3">Reserve a table</a>
    <b>Find us</b><br>Malaya, Sto. Domingo,<br>Nueva Ecija
  </div>
</aside>


<main id="accountPage" class="container py-5">

  <!-- Not logged in -->
  <section id="authBox" class="d-none">
    <h1 class="text-center mb-4">My <span class="gold-text">Account</span></h1>

    <ul class="nav nav-pills nav-fill mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">Login</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerPane" type="button">Register</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="loginPane">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-warning w-100">Login</button>
        </form>
      </div>

      <div class="tab-pane fade" id="registerPane">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label" for="regName">Full Name</label>
            <input type="text" id="regName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="regEmail">Email</label>
            <input type="email" id="regEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="regPassword">Password (min. 6 characters)</label>
            <input type="password" id="regPassword" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="regAddress">Delivery Address (optional)</label>
            <input type="text" id="regAddress" class="form-control">
          </div>
          <button type="submit" class="btn btn-warning w-100">Create Account</button>
        </form>
      </div>

      <p id="authMsg" class="small mt-2"></p>
    </div>
  </section>

  <!-- Logged in -->
  <section id="profileBox" class="d-none">
    <div class="account-head">
      <h1 class="mb-0">Hi, <span id="welcomeName"></span>!</h1>
      <a href="track.html" class="order-btn">Track Order →</a>
    </div>

    <form id="profileForm" class="mb-4">
      <h2 class="mb-3">Profile</h2>
      <div class="mb-3">
        <label class="form-label" for="profName">Full Name</label>
        <input type="text" id="profName" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="profEmail">Email</label>
        <input type="email" id="profEmail" class="form-control" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label" for="profAddress">Delivery Address</label>
        <input type="text" id="profAddress" class="form-control">
      </div>
      <button type="submit" class="btn btn-warning">Save Changes</button>
      <p id="profileMsg" class="small mt-2 mb-0"></p>
    </form>

    <h2 class="section-title">Order History</h2>
    <div id="orderHistory"></div>

    <button id="logoutBtn" type="button" class="btn btn-outline-danger">Logout</button>
  </section>
</main>


<footer>
  <span class="foot-brand">P&amp;J Restaurant</span>
  <p>© 2026 P&amp;J Restaurant. All Rights Reserved.</p>
</footer>

<script src="botjs/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/account.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
